<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d15"><title>Evidence Center — OSINT Panel"><link rel="stylesheet" href="/css/tool-bundle/hub.css"><link rel="stylesheet" href="/css/panel-41.css?v=4.2.0"><link rel="stylesheet" href="/css/unified-workstation.css?v=4.5.0">
<style>
:root{color-scheme:dark;--blue:#62c2ff;--line:#22364a;--muted:#8da2b8}.ev-page{width:min(1120px,calc(100% - 24px));margin:24px auto 50px;color:#e6f0fb}.ev-card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#111d2b,#0b131e);padding:18px;margin-bottom:13px}.ev-title{font-size:1.65rem;margin:0 0 6px}.ev-muted{color:var(--muted);font-size:.8rem;line-height:1.6}.ev-toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.ev-input,.ev-area{box-sizing:border-box;width:100%;padding:11px;border:1px solid #38536b;border-radius:9px;background:#07111b;color:#eef7ff}.ev-area{min-height:78px;resize:vertical}.ev-btn{padding:10px 14px;border:1px solid #62c2ff66;border-radius:9px;background:#174666;color:#e7f6ff;cursor:pointer;font-weight:700}.ev-btn.secondary{background:#132235;border-color:#2d465e}.ev-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ev-form .wide{grid-column:1/-1}.ev-item{border:1px solid #233b50;border-radius:11px;background:#0a1623;padding:14px;margin-top:9px}.ev-item h3{font-size:.95rem;margin:0 0 7px}.ev-item a{color:#83cfff;overflow-wrap:anywhere}.ev-meta{font-size:.7rem;color:#80a0ba;margin:7px 0}.ev-item p{font-size:.78rem;color:#b5c7d8;white-space:pre-wrap;overflow-wrap:anywhere}.ev-actions{display:flex;gap:8px;flex-wrap:wrap}.ev-status{min-height:20px;color:#91a7bc;font-size:.78rem;margin-top:9px}@media(max-width:650px){.ev-form{grid-template-columns:1fr}.ev-form .wide{grid-column:auto}.ev-page{width:calc(100% - 16px)}}
</style></head><body><header class="osint-header app-header"><div class="osint-header-inner scan-line"><div class="osint-logo"><a href="/" style="color:inherit;text-decoration:none">◎</a></div><div class="osint-title"><h1><a href="/" style="text-decoration:none;color:inherit"><span class="accent">OSINT</span><span class="dim">Panel</span></a></h1><p>Evidence Center · База материалов</p></div></div></header>
<main class="main osint-main ev-page"><section class="ev-card"><div class="ev-muted">INVESTIGATION WORKSPACE / EVIDENCE</div><h2 class="ev-title">Evidence <span style="color:var(--blue)">Center</span></h2><p class="ev-muted">Собирай проверяемые публичные источники в одном месте. Для каждого материала сохраняются URL, домен, время добавления, выдержка, заметки и необязательный SHA-256.</p><div class="ev-toolbar"><button class="ev-btn" id="refresh">Обновить список</button><a class="ev-btn secondary" href="/api/graph" style="text-decoration:none">Открыть Graph API</a></div><div class="ev-status" id="status" role="status"></div></section>
<section class="ev-card"><h3 style="margin-top:0">Добавить материал</h3><form id="form" class="ev-form"><input class="ev-input" id="title" maxlength="240" required placeholder="Название источника"><input class="ev-input" id="source" maxlength="160" placeholder="Источник / поисковик / модуль"><input class="ev-input wide" id="url" type="url" required placeholder="https://example.org/public-page"><textarea class="ev-area wide" id="snippet" maxlength="4000" placeholder="Краткая выдержка из публичной страницы"></textarea><textarea class="ev-area wide" id="notes" maxlength="4000" placeholder="Заметки аналитика: что подтверждено, что требует проверки"></textarea><input class="ev-input wide" id="sha256" maxlength="64" placeholder="SHA-256 файла (необязательно, 64 hex)"><div class="wide"><button class="ev-btn" type="submit">Сохранить материал</button></div></form></section>
<section class="ev-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h3 style="margin:0">Сохранённые материалы</h3><span class="ev-muted" id="count">0</span></div><div id="items" class="ev-muted" style="margin-top:10px">Загрузка…</div></section></main>
<script>(()=>{"use strict";const $=id=>document.getElementById(id),status=$("status"),items=$("items");const esc=s=>String(s||"");async function api(url,opts){const r=await fetch(url,{headers:{"Content-Type":"application/json"},...opts});const d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка API");return d;}function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n;}async function load(){items.textContent="Загрузка…";try{const d=await api("/api/evidence");$("count").textContent=String(d.count||0);items.replaceChildren();if(!d.items.length){items.textContent="Пока нет сохранённых материалов.";return;}d.items.forEach(x=>{const card=node("article","ev-item"),h=node("h3","",x.title),meta=node("div","ev-meta",x.domain+" · "+x.created_at+" · "+(x.source||"источник не указан")),a=node("a","",x.url);a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";const p=node("p","",x.snippet);const note=node("p","",x.notes?"Заметки: "+x.notes:"Заметок пока нет.");const hash=node("div","ev-meta",x.sha256?"SHA-256: "+x.sha256:"Хеш файла не указан");const actions=node("div","ev-actions");const edit=node("button","ev-btn secondary","Изменить заметку");edit.type="button";edit.onclick=async()=>{const value=prompt("Заметка аналитика",x.notes||"");if(value===null)return;try{await api("/api/evidence/"+encodeURIComponent(x.id),{method:"PATCH",body:JSON.stringify({notes:value})});await load();status.textContent="Заметка обновлена.";}catch(e){status.textContent=e.message;}};const del=node("button","ev-btn secondary","Удалить");del.type="button";del.onclick=async()=>{if(!confirm("Удалить этот материал?"))return;try{await api("/api/evidence/"+encodeURIComponent(x.id),{method:"DELETE"});await load();status.textContent="Материал удалён.";}catch(e){status.textContent=e.message;}};actions.append(edit,del);card.append(h,meta,a,p,note,hash,actions);items.append(card);});}catch(e){items.textContent=e.message;}}$("form").addEventListener("submit",async e=>{e.preventDefault();const payload={title:$("title").value,url:$("url").value,source:$("source").value,snippet:$("snippet").value,notes:$("notes").value,sha256:$("sha256").value};try{await api("/api/evidence",{method:"POST",body:JSON.stringify(payload)});$("form").reset();status.textContent="Материал сохранён.";await load();}catch(err){status.textContent=err.message;}});$("refresh").onclick=load;load();})();</script></body></html>
