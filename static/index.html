<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OSINT Panel — единая панель для разведки в открытых источниках: домены, email, имена пользователей, утечки.">
  <meta name="theme-color" content="#060608">
  <title>OSINT Panel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23060608' width='32' height='32' rx='4'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%2300ff88' font-family='monospace'>O</text></svg>">
  <link rel="stylesheet" href="/css/tool-bundle/hub.css">
</head>
<body>
  <div class="osint-bg cyber-grid" aria-hidden="true">
    <div class="particle" style="left:10%;bottom:-5px;--duration:9s;--delay:0s"></div>
    <div class="particle" style="left:22%;bottom:-5px;--duration:12s;--delay:1.2s"></div>
    <div class="particle" style="left:34%;bottom:-5px;--duration:10s;--delay:2.2s"></div>
    <div class="particle" style="left:46%;bottom:-5px;--duration:14s;--delay:3.4s"></div>
    <div class="particle" style="left:58%;bottom:-5px;--duration:11s;--delay:4.4s"></div>
    <div class="particle" style="left:70%;bottom:-5px;--duration:13s;--delay:5.6s"></div>
    <div class="particle" style="left:82%;bottom:-5px;--duration:10s;--delay:6.1s"></div>
    <div class="particle" style="left:94%;bottom:-5px;--duration:15s;--delay:7.0s"></div>
  </div>
  <header class="osint-header app-header">
    <div class="osint-header-inner scan-line">
      <div class="osint-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          
          <circle cx="12" cy="12" r="6"></circle>
          <circle cx="12" cy="12" r="2"></circle>
        </svg>
      </div>
      <div class="osint-title">
        <h1><span class="accent">OSINT</span><span class="dim">Panel</span></h1>
        <p>◆ Разведка по открытым источникам | домены, username, email, утечки | Python + UI</p>
      </div>
      <div class="app-header-right">
        <span class="app-header-system" id="header-system">ОС: —</span>
        <div class="app-header-user" id="header-user">
          <button type="button" class="app-header-user-btn" aria-expanded="false" aria-haspopup="true" id="btn-user-menu">
            <span class="app-header-user-icon" aria-hidden="true"></span>
            <span class="app-header-user-name">Admin</span>
            <span class="app-header-user-chevron" aria-hidden="true"></span>
          </button>
          <div class="app-header-user-menu" id="user-menu" hidden>
            <a href="/p/settings/" class="app-header-user-menu-item" data-tool-id="settings">API ключи</a>
          </div>
        </div>
      </div>
    </div>
    <div class="osint-tabs">
      <nav id="nav-tools" class="tab-nav" aria-label="Разделы"></nav>
    </div>
  </header>
  <div class="app-body osint-body">
    <main class="main osint-main osint-scrollbar" id="main-content">
      <p class="hub-intro">Каждый раздел — отдельная страница (один HTML, один CSS, один JS). Выберите вкладку выше или карточку ниже.</p>
      <div id="hub-cards" class="hub-grid" aria-label="Разделы панели"></div>
    </main>
  </div>
  <footer class="app-footer">
    <span>OSINT Panel</span>
    <span class="footer-hint">Разведка в открытых источниках — домены, email, соцсети</span>
  </footer>
  <script defer src="/js/header-env.js"></script>
  <script defer src="/js/header-ui.js"></script>
  <script>
    (function () {
      var h = (location.hash || "").replace(/^#/, "");
      if (!h) return;
      var legacy = { reports: "history", dashboard: "domain-tools", page: "domain-tools" };
      var id = legacy[h] || h;
      if (id) location.replace("/p/" + encodeURIComponent(id) + "/");
    })();
  </script>
  <script src="/js/app-hub.js" type="module"></script>
</body>
</html>
