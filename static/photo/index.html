<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060608" />
    <title>Фото — OSINT Panel</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23060608' width='32' height='32' rx='4'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%2300ff88' font-family='monospace'>O</text></svg>"
    />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/proba-theme.css" />
    <link rel="stylesheet" href="./css/photo.css" />
</head>
<body>
    <div class="osint-bg cyber-grid" aria-hidden="true">
      <div class="particle" style="left: 10%; bottom: -5px; --duration: 9s; --delay: 0s"></div>
      <div class="particle" style="left: 22%; bottom: -5px; --duration: 12s; --delay: 1.2s"></div>
      <div class="particle" style="left: 34%; bottom: -5px; --duration: 10s; --delay: 2.2s"></div>
      <div class="particle" style="left: 46%; bottom: -5px; --duration: 14s; --delay: 3.4s"></div>
      <div class="particle" style="left: 58%; bottom: -5px; --duration: 11s; --delay: 4.4s"></div>
      <div class="particle" style="left: 70%; bottom: -5px; --duration: 13s; --delay: 5.6s"></div>
      <div class="particle" style="left: 82%; bottom: -5px; --duration: 10s; --delay: 6.1s"></div>
      <div class="particle" style="left: 94%; bottom: -5px; --duration: 15s; --delay: 7s"></div>
    </div>

    <header class="osint-header app-header">
      <div class="osint-header-inner scan-line">
        <div class="osint-logo" aria-hidden="true">
          <a href="/" style="color: inherit; display: flex" title="На главную">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
          </a>
        </div>
        <div class="osint-title">
          <h1>
            <a href="/" style="text-decoration: none; color: inherit"
              ><span class="accent">OSINT</span><span class="dim">Panel</span></a
            >
          </h1>
          <p>Поиск по фотографии · EXIF, обратный поиск, OCR, QR</p>
        </div>
        <div class="app-header-right">
          <div class="photo-header-actions">
            <span class="badge badge-amber pulse" id="badgeRunning" style="display: none">0 активны</span>
            <span class="badge badge-done" id="badgeDone" style="display: none">0/20</span>
            <button class="btn" id="btnExport" style="display: none" onclick="exportReport()">
              <svg viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
        MD
      </button>
    </div>
          <span class="app-header-system" id="header-system">ОС: —</span>
          <div class="app-header-user" id="header-user">
            <button
              type="button"
              class="app-header-user-btn"
              aria-expanded="false"
              aria-haspopup="true"
              id="btn-user-menu"
            >
              <span class="app-header-user-icon" aria-hidden="true"></span>
              <span class="app-header-user-name">Admin</span>
              <span class="app-header-user-chevron" aria-hidden="true"></span>
            </button>
            <div class="app-header-user-menu" id="user-menu" hidden>
              <a href="/p/settings/" class="app-header-user-menu-item" data-tool-id="settings">API ключи</a>
            </div>
          </div>
        </div>
      </div>
      <div class="osint-tabs">
        <nav id="nav-tools" class="tab-nav" aria-label="Разделы">
          <a href="/domain/" class="tool-link" data-tool-id="domain-tools"
            ><span class="tab-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                
                <line x1="2" y1="12" x2="22" y2="12" />
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></svg></span
            >Домен</a
          >
          <a href="/username/" class="tool-link" data-tool-id="username-tools"
            ><span class="tab-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" /></svg></span
            >Username</a
          >
          <a href="/photo/" class="tool-link active" data-tool-id="photo-search"
            ><span class="tab-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                <circle cx="12" cy="13" r="3" /></svg></span
            >Фото</a
          >
          <a href="/p/ai-agent/" class="tool-link" data-tool-id="ai-agent"
            ><span class="tab-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
                <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
                <line x1="12" y1="5" x2="12" y2="18" /></svg></span
            >ИИ</a
          >
          <a href="/p/history/" class="tool-link" data-tool-id="history"
            ><span class="tab-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
                <path d="M12 7v5l4 2" /></svg></span
            >История</a
          >
          <a href="/p/anonsms/" class="tool-link" data-tool-id="anonsms">ANONSMS</a>
          <a href="/p/instagram-bruter/" class="tool-link" data-tool-id="instagram-bruter">Instagram</a>
          <a href="/p/grabcam/" class="tool-link" data-tool-id="grabcam"
            ><span class="tab-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
                <circle cx="12" cy="13" r="4" /></svg></span
            >Grabcam</a
          >
          <a href="/p/google-osint/" class="tool-link" data-tool-id="google-osint">Google OSINT</a>
        </nav>
      </div>
    </header>

    <div class="app-body osint-body">
      <div class="photo-shell">
        <div class="upload-section">
          <div class="upload-inner" id="uploadArea"></div>
        </div>
        <main class="main osint-main osint-scrollbar" id="mainArea"></main>
      </div>
          </div>

    <script defer src="/js/header-env.js"></script>
    <script defer src="/js/header-ui.js"></script>
    <script src="./js/photo.js"></script>
  <script defer src="/js/workspace.js?v=4.3.1"></script>
</body>
</html>
