name: Quality Checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test module registry
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Test integrated module runtime
        run: python -m unittest discover -s backend/tests -p "test_module_runtime.py" -v

      - name: Test IP/RDAP module
        run: python tools/ip-rdap/tests/test_tool.py -v

      - name: Test dnsx module
        run: python tools/dnsx/tests/test_tool.py -v

      - name: Test Subfinder module
        run: python tools/subfinder/tests/test_tool.py -v

      - name: Test Shodan module
        run: python tools/shodan/tests/test_tool.py -v

      - name: Test theHarvester module
        run: python tools/theharvester/tests/test_tool.py -v

      - name: Test Domain Search module
        run: python tools/domain-search/tests/test_tool.py -v

      - name: Test Sherlock module
        run: python tools/sherlock/tests/test_tool.py -v

      - name: Test Maigret module
        run: python tools/maigret/tests/test_tool.py -v

      - name: Test Blackbird module
        run: python tools/blackbird/tests/test_tool.py -v

      - name: Test Social Analyzer module
        run: python tools/social-analyzer/tests/test_tool.py -v

      - name: Validate integrated runtime modules
        run: python backend/module_cli.py runtime-check

      - name: Validate module manifests
        run: python backend/module_cli.py check
