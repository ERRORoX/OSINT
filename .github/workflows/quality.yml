name: Quality Checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test module registry
        run: python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Test IP/RDAP module
        run: python -m unittest discover -s tools/ip-rdap/tests -p "test_*.py" -v

      - name: Validate module manifests
        run: python backend/module_cli.py check
